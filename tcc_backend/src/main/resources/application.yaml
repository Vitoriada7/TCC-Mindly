spring:
    config:
        import: optional:file:./config/gemini.local.properties,optional:file:./config/google.local.properties,optional:file:./config/application.local.properties
    servlet:
        multipart:
            max-file-size: 8MB
            max-request-size: 9MB
    application:
        name: tcc_backend

    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/mindly}
        username: ${DB_USERNAME:postgres}
        password: ${DB_PASSWORD}
        hikari:
            maximum-pool-size: ${DB_POOL_SIZE:5}
            minimum-idle: 1

    flyway:
        default-schema: ${DB_SCHEMA:public}
        schemas: ${DB_SCHEMA:public}
        baseline-on-migrate: false

    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: false
        properties:
            hibernate:
                default_schema: ${DB_SCHEMA:public}

server:
    port: ${PORT:8080}
    error:
        include-message: never

jwt:
    public:
        key: ${JWT_PUBLIC_KEY:file:./config/authz.pub}
    private:
        key: ${JWT_PRIVATE_KEY:file:./config/authz.pem}
app:
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
gemini:
    max-attempts: ${GEMINI_MAX_ATTEMPTS:3}
    request-timeout-seconds: ${GEMINI_REQUEST_TIMEOUT_SECONDS:90}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-3.1-flash-lite}

google:
    tasks:
        client-id: ${GOOGLE_TASKS_CLIENT_ID:}
        client-secret: ${GOOGLE_TASKS_CLIENT_SECRET:}
        redirect-uri: ${GOOGLE_TASKS_REDIRECT_URI:http://localhost:4200/tarefas}
        encryption-key: ${GOOGLE_TASKS_ENCRYPTION_KEY:}
