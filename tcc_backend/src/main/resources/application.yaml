spring:
    config:
        import: optional:file:./config/gemini.local.properties
    servlet:
        multipart:
            max-file-size: 8MB
            max-request-size: 9MB
    application:
        name: tcc_backend

    datasource:
        url: jdbc:postgresql://localhost:5432/mindly
        username: postgres
        password: 180507

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true

server:
    error:
        include-message: always

jwt:
    public:
        key: classpath:authz.pub
    private:
        key: classpath:authz.pem
gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
