spring:
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
    flyway:
        default-schema: ${DB_SCHEMA:mindly}
        schemas: ${DB_SCHEMA:mindly}
    jpa:
        properties:
            hibernate:
                default_schema: ${DB_SCHEMA:mindly}
jwt:
    public:
        key: ${JWT_PUBLIC_KEY}
    private:
        key: ${JWT_PRIVATE_KEY}
app:
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS}
google:
    tasks:
        redirect-uri: ${GOOGLE_TASKS_REDIRECT_URI}
