<main class="splash" aria-labelledby="nome-app">
  <button class="skip-area" type="button" (click)="irParaLogin()" aria-label="Pular abertura e ir para o login">
    <span class="glow glow-one" aria-hidden="true"></span>
    <span class="glow glow-two" aria-hidden="true"></span>

    <span class="brand">
      <span class="logo-wrap">
        <img
          ngSrc="/images/logotipo-mindly.png"
          width="744"
          height="632"
          priority
          alt=""
        />
      </span>
      <span id="nome-app" class="name">Mindly</span>
      <span class="tagline">Seu espaço para uma rotina mais leve</span>
    </span>

    <span class="hint">Toque para continuar</span>
    <span class="progress" aria-hidden="true"><span></span></span>
  </button>
</main>
